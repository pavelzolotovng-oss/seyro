plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
android {
    namespace 'ru.seyro.monitor'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.seyro.monitor'
        minSdk 26
        targetSdk 35
        versionCode 1000 + buildNumber
        versionName '0.1'
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    signingConfigs {
        stable {
            def keyPath = System.getenv('SEYRO_MONITOR_KEYSTORE_PATH')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('SEYRO_MONITOR_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SEYRO_MONITOR_KEY_ALIAS')
                keyPassword System.getenv('SEYRO_MONITOR_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { if (System.getenv('SEYRO_MONITOR_KEYSTORE_PATH')) signingConfig signingConfigs.stable }
        release {
            minifyEnabled false
            if (System.getenv('SEYRO_MONITOR_KEYSTORE_PATH')) signingConfig signingConfigs.stable
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
