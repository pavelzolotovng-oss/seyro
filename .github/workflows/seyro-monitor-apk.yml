name: Build SEYRO Monitor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/seyro-monitor-mvp
    paths:
      - 'SEYRO_Monitor/**'
      - '.github/workflows/seyro-monitor-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SEYRO_Monitor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seyro-monitor-debug-apk
          path: SEYRO_Monitor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
