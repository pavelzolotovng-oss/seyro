name: Publish SEYRO Monitor release

on:
  push:
    tags:
      - 'seyro-monitor-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SEYRO_Monitor
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate tag and signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\(.*\)'/\1/p" app/build.gradle)
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9]*\)/\1/p' app/build.gradle)
          test "$GITHUB_REF_NAME" = "seyro-monitor-v$VERSION_NAME"
          test -n "$VERSION_CODE"
          for value in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!value}" || { echo "::error::Missing SEYRO Monitor signing secret: $value"; exit 1; }
          done
          echo "version_name=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name}" || { echo "::error::Missing repository Actions secret: $name"; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/seyro-release.jks
          test -s app/seyro-release.jks
          keytool -list -keystore app/seyro-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -keypass "$ANDROID_KEY_PASSWORD" >/dev/null
          export SEYRO_MONITOR_KEYSTORE_PATH="$PWD/app/seyro-release.jks"
          export SEYRO_MONITOR_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export SEYRO_MONITOR_KEY_ALIAS="$ANDROID_KEY_ALIAS"
          export SEYRO_MONITOR_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk seyro-monitor.apk
          echo "sha256=$(sha256sum seyro-monitor.apk | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="seyro-monitor-v$version_name"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "SEYRO Monitor $version_name" --generate-notes
          gh release upload "$TAG" seyro-monitor.apk --clobber

      - name: Update public manifest on main
        run: |
          git fetch origin main
          git checkout main
          export APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/seyro-monitor-v$version_name/seyro-monitor.apk"
          python3 - <<'PY'
          import json, os
          path = 'update.json'
          payload = {
              'latest': {
                  'version_code': int(os.environ['version_code']),
                  'version_name': os.environ['version_name'],
                  'apk_url': os.environ['APK_URL'],
                  'sha256': os.environ['sha256'],
                  'release_notes': f"SEYRO Monitor {os.environ['version_name']}",
              }
          }
          with open(path, 'w', encoding='utf-8') as stream:
              json.dump(payload, stream, ensure_ascii=False, indent=2)
              stream.write('\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet || git commit -m "Publish SEYRO Monitor $version_name update manifest"
          git push origin main
