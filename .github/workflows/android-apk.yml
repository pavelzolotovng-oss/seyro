name: Build SEYRO Lite APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SEYRO_Lite_Light/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: seyro-lite-apk-build-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Download Xray Android library
        run: |
          mkdir -p SEYRO_Lite_Light/app/libs
          curl -fL --retry 3 https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.10/libv2ray.aar -o SEYRO_Lite_Light/app/libs/libv2ray.aar
          curl -fL --retry 3 https://github.com/heiher/hev-socks5-tunnel/releases/download/2.18.0/hev-socks5-tunnel.aar -o SEYRO_Lite_Light/app/libs/hev-socks5-tunnel.aar
      - name: Configure persistent APK signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub repository Actions secrets."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > SEYRO_Lite_Light/app/seyro-release.jks
          test -s SEYRO_Lite_Light/app/seyro-release.jks
      - name: Build signed APK
        working-directory: SEYRO_Lite_Light
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/SEYRO_Lite_Light/app/seyro-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: seyro-lite-debug-apk
          path: SEYRO_Lite_Light/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
