name: Build SEYRO

# Fresh VPN build requested on 2026-10-19.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "SEYRO_Lite_Light/app/**"
      - "SEYRO_Lite_Light/build.gradle"
      - "SEYRO_Lite_Light/settings.gradle"
      - "SEYRO_Lite_Light/gradle.properties"
      - "SEYRO_Lite_Light/gradle/**"
      - "SEYRO_Lite_Light/gradlew"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: seyro-apk-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set build metadata
        id: meta
        run: echo "version_name=0.9.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Checkout main branch only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Configure persistent APK signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > SEYRO_Lite_Light/app/seyro-release.jks
          test -s SEYRO_Lite_Light/app/seyro-release.jks
          keytool -list -keystore SEYRO_Lite_Light/app/seyro-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -keypass "$ANDROID_KEY_PASSWORD" >/dev/null
      - name: Build sing-box APK
        working-directory: SEYRO_Lite_Light
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/SEYRO_Lite_Light/app/seyro-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug
      - name: Name official APK
        run: cp SEYRO_Lite_Light/app/build/outputs/apk/debug/app-debug.apk SEYRO_Lite_Light/app/build/outputs/apk/debug/seyro.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: seyro-apk
          path: SEYRO_Lite_Light/app/build/outputs/apk/debug/seyro.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish SEYRO release from main
        uses: softprops/action-gh-release@v2
        with:
          tag_name: seyro-v${{ steps.meta.outputs.version_name }}
          name: SEYRO ${{ steps.meta.outputs.version_name }}
          body: "SEYRO Android VPN client. sing-box/libbox 1.14.3. Built from the main branch."
          prerelease: false
          make_latest: true
          files: SEYRO_Lite_Light/app/build/outputs/apk/debug/seyro.apk
